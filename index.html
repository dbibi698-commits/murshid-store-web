async function doEmailAuth(){
  if (!fbReady()) { authMsg = "Sign-in is unavailable right now — please check your connection and retry."; authMsgOk = false; render(); return; }
  const em = document.getElementById("authEmail");
  const pw = document.getElementById("authPass");
  const nm = document.getElementById("authName");
  authMsg = ""; authMsgOk = false;
  const email = em ? em.value.trim() : "";
  const pass = pw ? pw.value : "";
  if (!email || !pass) { authMsg = "Please enter your email and password."; render(); return; }
  try {
    await fbPersist();
    if (authMode === "up") {
      const name = nm ? nm.value.trim() : "";
      if (!name) { authMsg = "Please write your name first."; render(); return; }
      const cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await cred.user.reload(); fbUser = firebase.auth().currentUser; render();
    } else {
      await firebase.auth().signInWithEmailAndPassword(email, pass);
    }
  } catch(e) { authMsg = authErrText(e); render(); }
}

async function sb(path, opts){
  const res = await fetch(SB + "/rest/v1/" + path, Object.assign({ headers: H }, opts || {}));
  if (!res.ok) throw new Error("The store database returned an error (HTTP " + res.status + "). Please try again.");
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

async function loadApps(){
  const rows = await sb("store_apps?select=*&published=eq.true&order=created_at.desc");
  const ratings = new Map(), downloads = new Map();
  const [rev, dl] = await Promise.all([
    sb("store_reviews?select=app_package,rating").catch(() => null),
    sb("store_downloads?select=app_package&limit=5000").catch(() => null)
  ]);
  if (Array.isArray(rev)) {
    const sums = new Map();
    rev.forEach(r => { if (!r.app_package) return; const c = sums.get(r.app_package) || {s:0,n:0}; c.s += Number(r.rating) || 0; c.n++; sums.set(r.app_package, c); });
    sums.forEach((v, k) => ratings.set(k, { avg: Math.round(v.s / v.n * 10) / 10, count: v.n }));
  }
  if (Array.isArray(dl)) dl.forEach(r => { if (r.app_package) downloads.set(r.app_package, (downloads.get(r.app_package) || 0) + 1); });
  apps = (Array.isArray(rows) ? rows : []).map(r => {
    const rt = ratings.get(r.package_name);
    return {
      id: r.id, name: r.name || "", package_name: r.package_name || "",
      version: r.version || "", size_text: r.size_text || "",
      category: r.category || "Other", description: r.description || "",
      policy_text: r.policy_text || "", icon_url: r.icon_url || "",
      apk_url: r.apk_url || "", created_at: r.created_at || "",
      rating_avg: rt ? rt.avg : null, rating_count: rt ? rt.count : 0,
      download_count: downloads.get(r.package_name) || 0
    };
  });
}

async function openDetail(id){
  view = "detail";
  detailApp = null;
  myRating = 0;
  render();
  window.scrollTo(0, 0);
  try {
    const rows = await sb("store_apps?select=*&id=eq." + encodeURIComponent(id) + "&published=eq.true&limit=1");
    const row = Array.isArray(rows) ? rows[0] : null;
    if (!row) { toast("This app is no longer available in the store."); view = "tabs"; render(); return; }
    const base = apps.find(a => a.id === row.id);
    detailApp = base || { id: row.id, name: row.name || "", package_name: row.package_name || "", version: row.version || "", size_text: row.size_text || "", category: row.category || "Other", description: row.description || "", policy_text: row.policy_text || "", icon_url: row.icon_url || "", apk_url: row.apk_url || "", created_at: row.created_at || "", rating_avg: null, rating_count: 0, download_count: 0 };
    detailReviews = [];
    if (detailApp.package_name) {
      const rv = await sb("store_reviews?select=*&app_package=eq." + encodeURIComponent(detailApp.package_name) + "&order=created_at.desc").catch(() => null);
      if (Array.isArray(rv)) detailReviews = rv;
    }
    render();
  } catch(e) {
    toast(e.message || "This app could not be loaded.");
    view = "tabs"; render();
  }
}

function renderDetail(){
  const a = detailApp;
  if (!a) { $view.innerHTML = '<div class="detailbg"><p class="loading">Loading…</p></div>'; return; }
  const favs = getFavs();
  const isFav = favs.includes(a.package_name);
  const others = apps.filter(x => x.id !== a.id).sort((x, y) => (x.category === a.category ? 0 : 1) - (y.category === a.category ? 0 : 1));
  const ratingTop = (a.rating_count > 0 && a.rating_avg !== null) ? a.rating_avg.toFixed(1) + " ★" : "— ★";
  const ratingBot = a.rating_count > 0 ? a.rating_count + " reviews" : "New app";
  const ratingHead = (a.rating_count > 0 && a.rating_avg !== null)
    ? stars(a.rating_avg) + " " + a.rating_avg.toFixed(1) + " (" + a.rating_count + " reviews)"
    : "☆☆☆☆☆ New app — no reviews yet";
  const reviewsHtml = detailReviews.length
    ? detailReviews.map(r => '<div class="review"><p><span class="rname fd">' + esc(r.user_name || "Guest") + '</span> <span class="rdate">' + fmtDate(r.created_at) + '</span></p>'
      + '<p class="rstars">' + stars(Number(r.rating) || 0) + '</p>'
      + (String(r.review_text || "").trim() ? '<p class="rtext">' + esc(r.review_text) + '</p>' : "") + '</div>').join("")
    : '<p class="sub">No reviews yet — write the first one!</p>';
  const starBtns = [1,2,3,4,5].map(n => '<button class="starpick fd press" data-star="' + n + '" role="radio" aria-checked="' + (myRating === n) + '" aria-label="' + n + ' star' + (n > 1 ? "s" : "") + '">' + (n <= myRating ? "★" : "☆") + '</button>').join("");
  $view.innerHTML = '<div class="detailbg"><div class="detailwrap">'
    + '<button class="backbtn fd press" id="btnBack">← Back</button>'
    + '<div class="dhead">' + iconHtml(a, 72)
    + '<div class="mid"><h1 class="fd">' + esc(a.name) + '</h1>'
    + '<p class="dmeta">' + esc(catName(a.category)) + ' • v' + esc(a.version) + ' • ' + esc(a.size_text) + ' • ' + esc(a.package_name) + '</p>'
    + '<p class="drating">' + ratingHead + '</p></div>'
    + '<div class="menuwrap"><button class="iconbtn press" id="btnMore" aria-label="More options" style="color:var(--text)">'
    + '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>'
    + '<div class="menu hidden" id="moreMenu"><button class="fd press" id="btnShare">Share</button></div></div></div>'
    + '<div class="stats"><div class="stat"><p class="top">' + ratingTop + '</p><p class="bot">' + ratingBot + '</p></div><div class="vdiv"></div>'
    + '<div class="stat"><p class="top">' + esc(a.size_text || "—") + '</p><p class="bot">Size</p></div><div class="vdiv"></div>'
    + '<div class="stat"><p class="top">' + esc(catName(a.category)) + '</p><p class="bot">Category</p></div><div class="vdiv"></div>'
    + '<div class="stat"><p class="top">⬇ ' + a.download_count + '</p><p class="bot">Downloads</p></div></div>'
    + '<button class="bigdl fd press" id="btnDownload">Download</button>'
    + '<div class="rowbtns"><button class="fd press" id="btnFav">' + (isFav ? "Remove favourite" : "Favourite") + '</button>'
    + '<button class="fd press" id="btnReport">Report</button></div>'
    + '<p class="note" style="margin-top:6px">' + INSTALL_NOTE + '</p>'
    + '<h3 class="dsec fd">Description</h3><p class="dbody">' + esc(String(a.description || "").trim() ? a.description : "No description given.") + '</p>'
    + '<h3 class="dsec fd">This app\'s Privacy Policy</h3><p class="policycard">' + esc(String(a.policy_text || "").trim() ? a.policy_text : "No Privacy Policy given for this app.") + '</p>'
    + '<h3 class="dsec fd">Reviews</h3><div style="margin-top:6px">' + reviewsHtml + '</div>'
    + '<h3 class="dsec fd">Write a review</h3><p class="sub" style="margin-top:4px">Your name is shown next to your review.</p>'
    + '<div style="margin-top:8px" role="radiogroup" aria-label="Your star rating">' + starBtns + '</div>'
    + '<label class="hidden" for="reviewName">Your name</label><input class="field" id="reviewName" placeholder="Your name" maxlength="60">'
    + '<label class="hidden" for="reviewText">Your review</label><textarea class="field" id="reviewText" placeholder="How did you like this app?" rows="2" maxlength="1000"></textarea>'
    + '<p class="err hidden" id="reviewErr"></p>'
    + '<button class="bigdl fd press" id="btnReview" style="margin-top:8px">Submit review</button>'
    + (others.length ? '<h3 class="dsec fd">More apps</h3><div style="margin-top:8px">' + others.map(cardHtml).join("") + '</div>' : "")
    + footerHtml() + '</div></div>';
  bindCards($view);
  const rn = document.getElementById("reviewName");
  if (rn && fbUser && fbUser.displayName) rn.value = fbUser.displayName;
  document.getElementById("btnBack").addEventListener("click", () => { view = "tabs"; render(); });
  document.getElementById("btnMore").addEventListener("click", () => document.getElementById("moreMenu").classList.toggle("hidden"));
  document.getElementById("btnShare").addEventListener("click", async () => {
    document.getElementById("moreMenu").classList.add("hidden");
    const text = "Murshid Store - " + a.name + " https://murshid.store/app/" + slugify(a.name);
    try {
      if (navigator.share) await navigator.share({ text });
      else if (navigator.clipboard) { await navigator.clipboard.writeText(text); toast("Share text copied"); }
      else toast(text);
    } catch(e) { /* share sheet cancelled */ }
  });
  document.getElementById("btnDownload").addEventListener("click", () => handleDownload(a));
  document.getElementById("btnFav").addEventListener("click", () => { toggleFav(a); render(); });
  document.getElementById("btnReport").addEventListener("click", () => showReport(a));
  $view.querySelectorAll("[data-star]").forEach(b => b.addEventListener("click", () => {
    myRating = Number(b.getAttribute("data-star"));
    $view.querySelectorAll("[data-star]").forEach((x, i) => { x.textContent = (i + 1) <= myRating ? "★" : "☆"; x.setAttribute("aria-checked", String(myRating === i + 1)); });
  }));
  document.getElementById("btnReview").addEventListener("click", async () => {
    const err = document.getElementById("reviewErr");
    if (!fbUser) { fail("Please sign in from the Account tab to write a review."); setTimeout(() => { tab = "profile"; view = "tabs"; render(); window.scrollTo(0, 0); }, 900); return; }
    const name = (fbUser.displayName || document.getElementById("reviewName").value.trim());
    const text = document.getElementById("reviewText").value.trim();
    const fail = m => { err.textContent = m; err.classList.remove("hidden"); };

      await sb("store_reviews", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ app_package: a.package_name, user_name: name, user_email: fbUser.email || "", user_photo: fbUser.photoURL || "", rating: myRating, review_text: text }) });

      await loadApps();

      if (fresh) detailApp = fresh;
      const rv = await sb("store_reviews?select=*&app_package=eq." + encodeURIComponent(a.package_name) + "&order=created_at.desc").catch(() => null);
      if (Array.isArray(rv)) detailReviews = rv;
      myRating = 0;
      render();
    } catch(e) { fail(e.message || "Review could not be submitted."); }
  });
}

function showReport(a){
  $dialog.innerHTML = '<div class="scrim" role="dialog" aria-modal="true" aria-label="Report this app"><div class="dialog">'
    + '<h3 class="fd">Report this app</h3><div style="margin-top:8px">'
    + REPORT_REASONS.map(r => '<button class="reason press" data-reason="' + esc(r) + '">' + esc(r) + '</button>').join("")
    + '</div><button class="widebtn fd press" id="btnCancelReport" style="margin-top:12px;height:48px">Cancel</button></div></div>';
  document.getElementById("btnCancelReport").addEventListener("click", () => { $dialog.innerHTML = ""; });
  $dialog.querySelectorAll("[data-reason]").forEach(b => b.addEventListener("click", async () => {
    const reason = b.getAttribute("data-reason");
    $dialog.innerHTML = "";
    try {
      await sb("store_reports", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ app_package: a.package_name, app_name: a.name, user_email: "", user_name: "Web visitor", reason: reason, details: "" }) });
      toast("Report sent. The Admin will review it.");
    } catch(e) { toast("Report could not be sent: " + (e.message || "error")); }
  }));
}

function toggleFav(a){
  const favs = getFavs();
  const has = favs.includes(a.package_name);
  setFavs(has ? favs.filter(p => p !== a.package_name) : [...favs, a.package_name]);
  toast(has ? "Removed from favourites." : "Added to favourites.");
}

let dlAbort = null;
let dlApp = null;
function fmtMB(b){ return (b / 1048576).toFixed(1) + " MB"; }
function fileNameFor(a){
  try {
    const last = decodeURIComponent(new URL(a.apk_url).pathname.split("/").pop() || "");
    if (/\.apk$/i.test(last)) return last;
  } catch(e){}
  return slugify(a.name || "app") + ".apk";
}
function dlRecord(a){
  sb("store_downloads", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ app_package: a.package_name, app_name: a.name, user_email: "", user_name: "Web visitor" }) }).catch(() => {});
  const hist = getHistory().filter(h => h.pkg !== a.package_name);
  hist.unshift({ pkg: a.package_name, name: a.name, icon_url: a.icon_url, at: new Date().toISOString() });
  setHistory(hist.slice(0, 50));
}
function dlShow(a){
  dlApp = a;
  document.getElementById("dlName").textContent = "Downloading " + a.name + "…";
  document.getElementById("dlMeta").textContent = "Starting…";
  const f = document.getElementById("dlFill");
  f.style.width = "0%"; f.classList.remove("indet");
  document.getElementById("dlbar").hidden = false;
}
function dlUpdate(done, total){
  const meta = document.getElementById("dlMeta");
  const f = document.getElementById("dlFill");
  if (total > 0) {
    const pct = Math.min(100, Math.round(done / total * 100));
    meta.textContent = fmtMB(done) + " / " + fmtMB(total) + "  •  " + pct + "%";
    f.style.width = pct + "%"; f.classList.remove("indet");
  } else {
    meta.textContent = fmtMB(done) + " downloaded…";
    f.classList.add("indet");
  }
}
function dlHide(){ document.getElementById("dlbar").hidden = true; dlApp = null; dlAbort = null; }
function dlCancel(){ if (dlAbort) dlAbort.abort(); }
function dlFallback(a){
  const link = document.createElement("a");
  link.href = a.apk_url; link.rel = "noopener";
  document.body.appendChild(link); link.click(); link.remove();
}
async function dlFetch(url, signal){
  try {
    return await fetch(url, { signal });
  } catch (e) {
    if (signal.aborted) throw e;
    if (url.indexOf("murshid-store-cache.dbibi698.workers.dev") !== -1) {
      return await fetch(url.replace("https://murshid-store-cache.dbibi698.workers.dev", "https://github.com"), { signal });
    }
    throw e;
  }
}
function showDownloadAd(cb){
  if (!ADS_ENABLED || !AD_SLOT_DOWNLOAD) { cb(); return; }
  $dialog.innerHTML = '<div class="scrim" role="dialog" aria-modal="true" aria-label="Advertisement"><div class="dialog">'
    + '<p class="adlabel">Advertisement</p>'
    + '<ins class="adsbygoogle adslot" style="display:block" data-ad-client="ca-pub-7198633592223192" data-ad-slot="' + AD_SLOT_DOWNLOAD + '" data-ad-format="auto" data-full-width-responsive="true"></ins>'
    + '<button class="bigdl fd press" id="btnContinueDl" style="margin-top:14px">Continue to download</button>'
    + '<button class="fd press" id="btnCloseDlAd" style="display:block;width:100%;background:none;border:0;color:var(--muted);font-size:14px;padding:10px 0 0;cursor:pointer">Close</button>'
    + '</div></div>';
  try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
  let finished = false;
  const done = () => { if (finished) return; finished = true; $dialog.innerHTML = ""; cb(); };
  document.getElementById("btnContinueDl").addEventListener("click", done);
  document.getElementById("btnCloseDlAd").addEventListener("click", done);
}
async function handleDownload(a){
  if (!a.apk_url) { toast("No download link for this app yet."); return; }
  if (dlAbort) { toast("A download is already running — please wait or cancel it."); return; }
  showDownloadAd(function(){ startDownload(a); });
}
async function startDownload(a){
  dlShow(a);
  const ctrl = new AbortController(); dlAbort = ctrl;
  const chunks = []; let done = 0, total = 0;
  try {
    const res = await dlFetch(a.apk_url, ctrl.signal);
    if (!res.ok) throw new Error("HTTP " + res.status);
    if (!res.body) throw new Error("stream unsupported");
    total = Number(res.headers.get("Content-Length") || 0) || 0;
    const reader = res.body.getReader();
    let lastUi = 0;
    for (;;) {
      const r = await reader.read();
      if (r.done) break;
      chunks.push(r.value); done += r.value.length;
      const now = Date.now();
      if (now - lastUi > 120) { dlUpdate(done, total); lastUi = now; }
    }
    dlUpdate(done, total);
    const blob = new Blob(chunks, { type: "application/vnd.android.package-archive" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = fileNameFor(a);
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    dlRecord(a);
    toast("Downloaded " + a.name + ".");
    if (view === "tabs" && tab === "profile") render();
  } catch (e) {
    if (e && e.name === "AbortError") {
      toast("Download cancelled.");
    } else {
      toast("In-page download failed — opening the browser download instead.");
      dlFallback(a);
      dlRecord(a);
    }
  } finally {
    dlHide();
  }
}

function bindCards(root){
  root.querySelectorAll("[data-open]").forEach(el => {
    const go = () => openDetail(Number(el.getAttribute("data-open")));
    el.addEventListener("click", e => { if (e.target.closest("[data-dl]")) return; go(); });
    el.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
  root.querySelectorAll("[data-dl]").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      const a = apps.find(x => x.id === Number(el.getAttribute("data-dl")));
      if (a) handleDownload(a);
    });
  });
}
function bindCommon(){
  bindCards($view);
  const s = document.getElementById("btnSearch");
  if (s) s.addEventListener("click", () => { view = "search"; render(); window.scrollTo(0, 0); });
  const r = document.getElementById("btnRefresh");
  if (r) r.addEventListener("click", async () => { try { await loadApps(); render(); } catch(e) { toast(e.message); } });
  $view.querySelectorAll("[data-chip]").forEach(el => el.addEventListener("click", () => { chip = el.getAttribute("data-chip"); render(); }));
  $view.querySelectorAll("[data-page]").forEach(el => el.addEventListener("click", () => { view = el.getAttribute("data-page"); render(); window.scrollTo(0, 0); }));
}

function renderNav(){
  const row = document.getElementById("navrow");
  row.innerHTML = NAV.map(t => '<button class="navtab press-tab' + (tab === t.id ? " active" : "") + '" data-tab="' + t.id + '" aria-label="' + t.label + '"' + (tab === t.id ? ' aria-current="page"' : "") + '>'
    + '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + t.path + '"/></svg>'
    + '<span class="lbl fd">' + t.label + '</span><span class="dot"></span></button>').join("");
  const idx = NAV.findIndex(t => t.id === tab);
  const ind = document.getElementById("indicator");
  ind.style.left = "calc(14px + " + idx + " * (100% - 14px) / 4)";
  ind.style.width = "calc((100% - 14px) / 4 - 14px)";
  row.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", () => {
    tab = el.getAttribute("data-tab"); view = "tabs"; render(); window.scrollTo(0, 0);
  }));
}

function render(){
  const inSub = view !== "tabs";
  $nav.style.display = inSub ? "none" : "";
  document.getElementById("orbP").style.display = inSub ? "none" : "";
  document.getElementById("orbB").style.display = inSub ? "none" : "";
  if (view === "search") return renderSearch();
  if (view === "detail") return renderDetail();
  if (view === "policy") return renderPolicy();
  if (view === "terms") return renderTerms();
  if (view === "about") return renderAbout();
  if (view === "contact") return renderContact();
  renderNav();
  if (tab === "home") renderHome();
  else if (tab === "games") renderCategory("Games", "Games", "All apps in the Games category");
  else if (tab === "tools") renderCategory("Tools", "Tools", "All apps in the Tools category");
  else renderProfile();
}

(async function init(){
  document.getElementById("dlCancel").addEventListener("click", dlCancel);
  setTimeout(() => document.getElementById("splash").classList.add("gone"), 1500);
  setTimeout(() => document.getElementById("splash").remove(), 2100);
  $view.innerHTML = '<div class="wrap"><p class="loading">Loading…</p></div>';
  renderNav();
  try {
    await loadApps();
  } catch(e) {
    $view.innerHTML = '<div class="wrap"><div style="padding:56px 0;text-align:center"><p class="sub">' + esc(e.message || "The store could not be loaded.") + '</p>'
      + '<button class="dlbtn fd press" style="margin-top:16px" onclick="location.reload()">Retry</button></div></div>';
    return;
  }
  render();
})();
</script>
